<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Минималистичный калькулятор с историей вычислений и тёмной темой.">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Применяем тему до отрисовки, чтобы не было мигания
    (function () {
      try {
        var saved = localStorage.getItem('calc.theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* localStorage недоступен */ }
    })();
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="glow glow--1"></span>
    <span class="glow glow--2"></span>
  </div>

  <main class="app">
    <div class="calculator" id="calculator">

      <header class="topbar">
        <button class="icon-btn" id="historyBtn" type="button" aria-label="История вычислений" aria-expanded="false" aria-controls="historyPanel" title="История (H)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" />
            <path d="M3 4v4.5h4.5" />
            <path d="M12 7.5V12l3 2" />
          </svg>
        </button>

        <span class="topbar__title">Калькулятор</span>

        <button class="icon-btn" id="themeBtn" type="button" aria-label="Переключить тему" title="Сменить тему (T)">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
        </button>
      </header>

      <section class="display" aria-label="Дисплей">
        <div class="expression" id="expression" aria-live="polite"></div>
        <div class="result-row">
          <button class="copy-btn" id="copyBtn" type="button" aria-label="Скопировать результат" title="Копировать (Ctrl+C)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8.5" y="8.5" width="11" height="11" rx="2.5" />
              <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
            </svg>
          </button>
          <output class="result" id="result" aria-live="polite">0</output>
        </div>
      </section>

      <section class="keypad" id="keypad" aria-label="Клавиатура">
        <button class="key key--fn" type="button" data-action="clear" aria-label="Очистить всё">AC</button>
        <button class="key key--fn" type="button" data-action="sign" aria-label="Изменить знак">
          <span class="key__sign">+/−</span>
        </button>
        <button class="key key--fn" type="button" data-action="percent" aria-label="Процент">%</button>
        <button class="key key--op" type="button" data-action="operator" data-value="/" aria-label="Разделить">÷</button>

        <button class="key key--num" type="button" data-action="digit" data-value="7">7</button>
        <button class="key key--num" type="button" data-action="digit" data-value="8">8</button>
        <button class="key key--num" type="button" data-action="digit" data-value="9">9</button>
        <button class="key key--op" type="button" data-action="operator" data-value="*" aria-label="Умножить">×</button>

        <button class="key key--num" type="button" data-action="digit" data-value="4">4</button>
        <button class="key key--num" type="button" data-action="digit" data-value="5">5</button>
        <button class="key key--num" type="button" data-action="digit" data-value="6">6</button>
        <button class="key key--op" type="button" data-action="operator" data-value="-" aria-label="Вычесть">−</button>

        <button class="key key--num" type="button" data-action="digit" data-value="1">1</button>
        <button class="key key--num" type="button" data-action="digit" data-value="2">2</button>
        <button class="key key--num" type="button" data-action="digit" data-value="3">3</button>
        <button class="key key--op" type="button" data-action="operator" data-value="+" aria-label="Прибавить">+</button>

        <button class="key key--num" type="button" data-action="backspace" aria-label="Удалить последнюю цифру">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7 6-7Z" />
            <path d="m12.5 9.5 5 5M17.5 9.5l-5 5" />
          </svg>
        </button>
        <button class="key key--num" type="button" data-action="digit" data-value="0">0</button>
        <button class="key key--num" type="button" data-action="decimal" aria-label="Десятичная запятая">,</button>
        <button class="key key--op" type="button" data-action="equals" aria-label="Равно">=</button>
      </section>

      <aside class="history" id="historyPanel" aria-label="История вычислений" aria-hidden="true">
        <div class="history__header">
          <h2 class="history__title">История</h2>
          <div class="history__actions">
            <button class="text-btn" id="clearHistoryBtn" type="button">Очистить</button>
            <button class="icon-btn icon-btn--small" id="closeHistoryBtn" type="button" aria-label="Закрыть историю">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
        </div>
        <ul class="history__list" id="historyList"></ul>
        <p class="history__empty" id="historyEmpty">Пока нет вычислений</p>
        <p class="history__hint">Нажмите на запись, чтобы использовать результат</p>
      </aside>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
